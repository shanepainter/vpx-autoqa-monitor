<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="VPX AutoQA">
  <defs>
    <radialGradient id="bg" cx="50%" cy="34%" r="74%">
      <stop offset="0%" stop-color="#161d28"/>
      <stop offset="100%" stop-color="#080a0f"/>
    </radialGradient>
    <radialGradient id="ball" cx="37%" cy="31%" r="80%">
      <stop offset="0%" stop-color="#eafdff"/>
      <stop offset="25%" stop-color="#7cf3ff"/>
      <stop offset="100%" stop-color="#0bb4d6"/>
    </radialGradient>
    <linearGradient id="flipL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff2d9b"/>
      <stop offset="100%" stop-color="#ff86cb"/>
    </linearGradient>
    <linearGradient id="flipR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#ff2d9b"/>
      <stop offset="100%" stop-color="#ff86cb"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- backglass panel -->
  <rect x="16" y="16" width="480" height="480" rx="70" fill="url(#bg)"
        stroke="#2bff88" stroke-opacity="0.22" stroke-width="2.5"/>

  <!-- QA monitor pulse (subtle, behind) -->
  <path d="M52 232 H168 l16 -44 l26 92 l20 -118 l18 70 H460"
        fill="none" stroke="#2bff88" stroke-width="5"
        stroke-linejoin="round" stroke-linecap="round" opacity="0.45"/>

  <!-- pinball -->
  <circle cx="256" cy="286" r="56" fill="url(#ball)" filter="url(#glow)"/>
  <circle cx="234" cy="264" r="15" fill="#ffffff" opacity="0.9"/>

  <!-- flippers (catch pose) + pivots -->
  <g filter="url(#glow)">
    <rect x="150" y="382" width="120" height="30" rx="15" fill="url(#flipL)" transform="rotate(-27 165 397)"/>
    <rect x="242" y="382" width="120" height="30" rx="15" fill="url(#flipR)" transform="rotate(27 347 397)"/>
    <circle cx="165" cy="397" r="11" fill="#ff5fb2"/>
    <circle cx="347" cy="397" r="11" fill="#ff5fb2"/>
  </g>
</svg>
